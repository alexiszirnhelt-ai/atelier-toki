<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Fond paper -->
  <rect width="1200" height="630" fill="#F7F4EE"/>
  
  <!-- Bande indigo en bas pour la signature -->
  <rect x="0" y="540" width="1200" height="90" fill="#3D4A5C"/>
  
  <!-- Caractère 時 centré -->
  <text
    x="600"
    y="280"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="serif"
    font-size="240"
    font-weight="500"
    fill="#1A1816"
  >時</text>
  
  <!-- Nom du site -->
  <text
    x="600"
    y="430"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="serif"
    font-size="56"
    font-weight="500"
    fill="#1A1816"
  >L'Atelier Toki</text>
  
  <!-- Sous-titre -->
  <text
    x="600"
    y="490"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="22"
    letter-spacing="6"
    fill="#5C564E"
  >POTERIE ARTISANALE</text>
  
  <!-- URL en bas -->
  <text
    x="600"
    y="585"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="20"
    letter-spacing="4"
    fill="#F7F4EE"
  >ATELIER-TOKI.VERCEL.APP</text>
</svg>