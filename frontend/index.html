<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Title -->
    <title>L'Atelier Toki — Poterie artisanale</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Site e-commerce fictif d'un atelier de poterie japonisant. Découvrez nos créations façonnées à la main, nos stages d'initiation, et l'univers wabi-sabi de L'Atelier Toki."
    />
    <meta name="author" content="L'Atelier Toki" />
    <meta name="theme-color" content="#F7F4EE" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://atelier-toki.vercel.app" />
    <meta property="og:title" content="L'Atelier Toki — Poterie artisanale" />
    <meta
      property="og:description"
      content="Site e-commerce fictif d'un atelier de poterie japonisant. Projet d'apprentissage full-stack."
    />
    <meta
      property="og:image"
      content="https://atelier-toki.vercel.app/og-image.svg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="L'Atelier Toki" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="L'Atelier Toki — Poterie artisanale" />
    <meta
      name="twitter:description"
      content="Site e-commerce fictif d'un atelier de poterie japonisant. Projet d'apprentissage full-stack."
    />
    <meta
      name="twitter:image"
      content="https://atelier-toki.vercel.app/og-image.svg"
    />

    <!-- Google Fonts (chargement non-bloquant) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600&family=Noto+Serif+JP:wght@500&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600&family=Noto+Serif+JP:wght@500&display=swap"
      />
    </noscript>
    <!-- Précharge l'image hero de la page d'accueil (LCP) -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?auto=format&fit=crop&w=1200&q=75"
      imagesrcset="
    https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?auto=format&fit=crop&w=800&q=75 800w,
    https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?auto=format&fit=crop&w=1200&q=75 1200w,
    https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?auto=format&fit=crop&w=1600&q=75 1600w
  "
      imagesizes="100vw"
      fetchpriority="high"
    />
